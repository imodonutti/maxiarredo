# Indirizzo assoluto del sito usato in anteprime social, canonical e dati strutturati.
# Le pagine contengono https://www.maxiarredo.com/; sull'anteprima dinamoai.it viene riscritto
# con l'indirizzo dell'anteprima, così l'immagine di condivisione si vede già. Al lancio non serve toccare nulla.
# progetto.html?p=<slug> (vecchi indirizzi del prototipo) -> /progetti/<slug>/ ; solo slug validi
map $arg_p $slug_progetto {
    "~^(?<s>[a-z0-9-]+)$"    $s;
    default                  "";
}

map $host $sito_url {
    default                  "https://www.maxiarredo.com/";
    maxiarredo.dinamoai.it   "https://maxiarredo.dinamoai.it/";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;            # non dichiara la versione di nginx
    charset utf-8;                # accenti corretti anche in llms.txt e sitemap

    include /etc/nginx/auth.inc;  # password dell'anteprima (vedi 40-basic-auth.sh)

    # ANTEPRIMA: blocca i motori. AL LANCIO sostituire con (tutti i bot ammessi, AI comprese):
    # "User-agent: *\nAllow: /\n\nSitemap: https://www.maxiarredo.com/sitemap.xml\n"
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        include /etc/nginx/snippets/sicurezza.conf;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Indirizzi del vecchio sito maxiarredo.com: redirect permanenti (301) alle pagine nuove,
    # per non perdere posizionamento e link salvati. I parametri (?lSite=it) vengono scartati.
    absolute_redirect off;   # Location relativa: resta su https e sul dominio da cui arriva la richiesta
    location = /home-page.html     { return 301 /; }
    location = /home-page-it.html  { return 301 /; }
    location = /chi-siamo.html     { return 301 /#metodo; }
    location = /team.html          { return 301 /#metodo; }
    location = /showroom.html      { return 301 /#showroom; }
    location = /brand.html         { return 301 /#showroom; }
    location = /dove-siamo.html    { return 301 /#contatti; }
    location = /promozioni.html    { return 301 /#showroom; }
    location = /blog.html          { return 301 /; }   # finché gli Approfondimenti non tornano online
    location = /social-wall.html   { return 301 /; }

    # indirizzi del prototipo prima delle pagine generate
    location = /progetti.html      { return 301 /progetti/; }
    location = /progetto.html {
        if ($slug_progetto) { return 301 /progetti/$slug_progetto/; }
        return 301 /progetti/;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/sicurezza.conf;
    }

    # CSS e JS hanno ?v=... nei link: possono restare in cache un anno
    location ~* ^/assets/.+\.(css|js)$ {
        include /etc/nginx/snippets/sicurezza.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # dati dei progetti: sempre riconvalidati (cambiano senza ?v=)
    location /assets/data/ {
        include /etc/nginx/snippets/sicurezza.conf;
        add_header Cache-Control "no-cache";
    }

    # caratteri: non cambiano mai di contenuto
    location /assets/fonts/ {
        include /etc/nginx/snippets/sicurezza.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # immagini: 30 giorni
    location /assets/ {
        include /etc/nginx/snippets/sicurezza.conf;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ =404;
        sub_filter 'https://www.maxiarredo.com/' $sito_url;
        sub_filter_once off;
        include /etc/nginx/snippets/sicurezza.conf;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json application/xml application/manifest+json;
    gzip_min_length 512;
    gzip_comp_level 6;
}
