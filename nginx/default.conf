server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Anteprima: fuori dai motori di ricerca
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/auth.inc;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # CSS e JS hanno ?v=... nei link: possono restare in cache un anno
    location ~* ^/assets/.+\.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # immagini: 30 giorni
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;
    gzip_min_length 512;
    gzip_comp_level 6;
}
