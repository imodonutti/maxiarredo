server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;            # non dichiara la versione di nginx

    include /etc/nginx/auth.inc;  # password dell'anteprima (vedi 40-basic-auth.sh)

    # ANTEPRIMA: blocca i motori. AL LANCIO sostituire con
    # "User-agent: *\nAllow: /\nSitemap: https://www.maxiarredo.com/sitemap.xml\n"
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        include /etc/nginx/snippets/sicurezza.conf;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/sicurezza.conf;
    }

    # CSS e JS hanno ?v=... nei link: possono restare in cache un anno
    location ~* ^/assets/.+\.(css|js)$ {
        include /etc/nginx/snippets/sicurezza.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # immagini e caratteri: 30 giorni
    location /assets/ {
        include /etc/nginx/snippets/sicurezza.conf;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/sicurezza.conf;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json application/xml application/manifest+json;
    gzip_min_length 512;
    gzip_comp_level 6;
}
