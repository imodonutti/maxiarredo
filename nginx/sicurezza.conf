# Header di sicurezza: incluso in ogni location (in nginx un add_header dentro una
# location annulla quelli del livello superiore, quindi vanno ripetuti qui).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Tutto arriva dal nostro dominio (caratteri compresi). Se il modulo Dinamoweb userà servizi
# esterni (es. reCAPTCHA, invio a un altro dominio) vanno aggiunti qui in script-src / frame-src / connect-src / form-action.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

# ANTEPRIMA: fuori dai motori di ricerca. AL LANCIO: togliere questa riga
# (e nel default.conf la regola robots.txt "Disallow", e i meta robots noindex nelle pagine).
add_header X-Robots-Tag "noindex, nofollow" always;
